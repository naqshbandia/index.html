 <!DOCTYPE html>
<html dir="rtl">
<head>
<style>
    body { font-family: Arial; background: #0f3d2e; color: white; text-align: center; padding: 20px; }
    .box { background: rgba(0,0,0,0.3); padding: 20px; border: 2px solid #ffd700; border-radius: 10px; display: inline-block; }
    input { padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #ffd700; width: 200px; text-align: center; }
    button { background: #ffd700; color: #000; padding: 10px 20px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #result { font-size: 24px; color: #00ffcc; margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<div class="box">
    <h2>AbuHamad Admin Panel</h2>
    <p>کسٹمر کا موبائل نمبر لکھیں:</p>
    <input type="number" id="custPhone" placeholder="03329106002">
    
    <p>کسٹمر کی ڈیوائس آئی ڈی (جو واٹس ایپ پر آئی):</p>
    <input type="number" id="custDevice" placeholder="1234">
    
    <br>
    <button onclick="generateCode()">کوپن کوڈ نکالیں</button>
    
    <div id="result"></div>
</div>

<script>
function generateCode() {
    let p = document.getElementById("custPhone").value;
    let d = document.getElementById("custDevice").value;
    const SALT = 5050;

    if(p && d) {
        let lastFour = p.slice(-4); // نمبر کے آخری 4 ہندسے
        let code = (parseInt(lastFour) + parseInt(d) + SALT).toString().slice(-4);
        document.getElementById("result").innerText = "کسٹمر کا کوڈ یہ ہے: " + code;
    } else {
        alert("براہ کرم تمام معلومات درج کریں");
    }
}
</script>

</body>
</html>
