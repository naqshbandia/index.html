<script>

/* =========================

/* =========================
   🔘 TAB SWITCH
========================= */

function showTab(n){

document.querySelectorAll(".calcBox")
.forEach(e=>e.style.display="none");

document.getElementById("tab"+n)
.style.display="block";

document.querySelectorAll(".tabs button")
.forEach(b=>b.classList.remove("active"));

document.querySelectorAll(".tabs button")[n-1]
.classList.add("active");

}

/* =========================
   🔥 CREATE TABLE
========================= */

function createCalc(id,tabNo){

let html = `

<table>

<thead>

<tr>
<th>سائز</th>
<th>کٹنگ</th>
<th>تعداد</th>
<th>فٹواری</th>
<th>سینکڑے</th>
</tr>

</thead>

<tbody>

`;

data[tabNo].forEach(s=>{

html += `

<tr>

<td class="size">${s.size}</td>

<td class="cut">${s.cut}</td>

<td>
<input type="number" oninput="calc(this)">
</td>

<td class="rowTotal">0</td>

<td class="hundred">0</td>

</tr>

`;

});

html += `

</tbody>

<tfoot>

<tr>

<td class="grandTotal">0</td>

<td class="grandHundred">0</td>

</tr>

</tfoot>

<input type="number" oninput="rateCalc(this)">
</td>

<td class="rateResult">0</td>

</tr>

<tr>

<td>سینکڑا ریٹ</td>

<td>
<input type="number" oninput="rateCalc(this)">
</td>

<td class="rateResult">0</td>

</tr>

</table>

</div>

`;

document.getElementById(id).innerHTML = html;

}

/* =========================
   🔢 CALCULATION
========================= */

function calc(input){

let table = input.closest("table");

let rows = table.querySelectorAll("tbody tr");

let total = 0;

let hundred = 0;

rows.forEach(r=>{

let size = +r.children[0].innerText;

let cut = +r.children[1].innerText;

let qty = +r.querySelector("input").value || 0;

let t = size * cut * qty;

let h = t / 100;

r.children[3].innerText = t;

r.children[4].innerText = h.toFixed(2);

total += t;

hundred += h;

});

table.querySelector(".grandTotal")
.innerText = total;

table.querySelector(".grandHundred")
.innerText = hundred.toFixed(2);

rateCalc(input);

}

/* =========================
   💰 RATE SYSTEM
========================= */

function rateCalc(input){

let box = input.closest(".calcBox");

let table = box.querySelector("table");

let total =
+table.querySelector(".grandTotal").innerText;

let rates =
box.querySelectorAll(".rateBox input");

let results =
box.querySelectorAll(".rateResult");

let r1 = +rates[0].value || 0;

let r2 = +rates[1].value || 0;

results[0].innerText =
(total * r1).toFixed(2);

results[1].innerText =
(total / 100 * r2).toFixed(2);

}

/* =========================
   🚀 INIT
========================= */

createCalc("tab1",1);
createCalc("tab2",2);
createCalc("tab3",3);
createCalc("tab4",4);

/* =========================

========================= */

})

.catch(err => console.log(err));

/* =========================
   📥 INSTALL BUTTON
========================= */

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {

e.preventDefault();

deferredPrompt = e;

const installBtn = document.createElement("button");

installBtn.innerText = "📲 INSTALL APP";

installBtn.style.position = "fixed";
installBtn.style.bottom = "20px";
installBtn.style.left = "20px";
installBtn.style.padding = "10px";
installBtn.style.border = "none";
installBtn.style.borderRadius = "10px";
installBtn.style.background = "gold";
installBtn.style.fontWeight = "bold";
installBtn.style.zIndex = "99999";

document.body.appendChild(installBtn);

installBtn.addEventListener('click', async () => {

installBtn.remove();

deferredPrompt.prompt();

const { outcome } =
await deferredPrompt.userChoice;

if(outcome === 'accepted'){

console.log('PWA Installed');

}

deferredPrompt = null;

});

});
