 <!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbuHamad Admin Panel - Pro Database</title>
<style>
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background: radial-gradient(circle at center, #0a2e1f 0%, #051a12 100%); 
        color: white; text-align: center; padding: 20px 15px; margin: 0; min-height: 100vh;
    }
    .admin-container { 
        background: rgba(0,0,0,0.8); padding: 25px; border: 2px solid #e0c38c; 
        border-radius: 20px; display: inline-block; box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        max-width: 320px; width: 100%; position: relative;
    }
    h2 { color: #e0c38c; border-bottom: 1px solid rgba(224, 195, 140, 0.3); padding-bottom: 15px; font-size: 20px; }
    
    /* سرچ باکس اسٹائل */
    .search-box {
        background: rgba(255,255,255,0.1); border: 1px solid #00ffcc; border-radius: 10px;
        padding: 10px; margin-bottom: 20px;
    }
    .search-box input {
        background: transparent; border: none; color: #00ffcc; text-align: center;
        width: 100%; outline: none; font-size: 16px;
    }

    .input-group { margin-bottom: 15px; text-align: right; }
    label { display: block; color: #e0c38c; font-size: 13px; margin-bottom: 5px; }
    input { 
        padding: 12px; border-radius: 8px; border: 1px solid #e0c38c; 
        width: 100%; text-align: center; font-size: 16px; box-sizing: border-box;
    }
    button { 
        background: linear-gradient(135deg, #e0c38c 0%, #b8860b 100%); 
        color: #000; padding: 14px; border: none; font-weight: bold; cursor: pointer; 
        border-radius: 10px; width: 100%; margin-top: 10px; font-size: 16px;
    }
    
    #resultBox, #searchResult { 
        margin-top: 20px; padding: 15px; border: 2px dashed #00ffcc; 
        border-radius: 12px; background: rgba(0,255,204,0.1); display: none;
    }
    .footer-text { margin-top: 20px; font-size: 10px; color: #aaa; }
</style>
</head>
<body>

<div class="admin-container">
    <h2>AbuHamad Admin Panel</h2>

    <div class="search-box">
        <label style="text-align: center; display: block; font-size: 11px; color: #00ffcc;">پرانا کوڈ تلاش کریں (نمبر لکھیں)</label>
        <input type="number" id="searchPhone" placeholder="نمبر لکھ کر تلاش کریں..." oninput="searchData()">
    </div>
    
    <div id="searchResult">
        <span style="font-size: 12px;">مل گیا! اس کسٹمر کا کوڈ یہ ہے:</span>
        <div id="foundCode" style="font-size: 24px; color: #ffd700; font-weight: bold; margin-top: 5px;"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(224, 195, 140, 0.2); margin: 20px 0;">

    <div class="input-group">
        <label>کسٹمر کا موبائل نمبر:</label>
        <input type="number" id="custPhone" placeholder="03XXXXXXXXX">
    </div>
    
    <div class="input-group">
        <label>ڈیوائس آئی ڈی:</label>
        <input type="number" id="custDevice" placeholder="1234">
    </div>
    
    <button onclick="generateCode()">کوڈ جنریٹ اور سیو کریں</button>
    
    <div id="resultBox">
        <span style="font-size: 13px;">نیا تیار کردہ کوڈ:</span>
        <div id="resultText" style="font-size: 28px; color: #00ffcc; font-weight: bold;"></div>
        <p style="font-size: 11px; color: #fff;">(یہ ڈیٹا خود بخود سیو ہو گیا ہے)</p>
    </div>

    <div class="footer-text">Powered by AbuHamad GRFX Database v2.0</div>
</div>

<script>
// ڈیٹا سیو کرنے اور جنریٹ کرنے کا فنکشن
function generateCode() {
    const pInput = document.getElementById("custPhone");
    const dInput = document.getElementById("custDevice");
    const resultBox = document.getElementById("resultBox");
    const resultText = document.getElementById("resultText");
    
    let p = pInput.value.trim();
    let d = dInput.value.trim();
    const SALT = 5050;

    if(p.length >= 4 && d !== "") {
        let lastFour = p.slice(-4); 
        let finalCode = parseInt(lastFour) + parseInt(d) + SALT;
        
        // --- ڈیٹا بیس (LocalStorage) میں سیو کریں ---
        let customers = JSON.parse(localStorage.getItem("abuHamadDB") || "{}");
        customers[p] = finalCode; // نمبر کے ساتھ کوڈ محفوظ
        localStorage.setItem("abuHamadDB", JSON.stringify(customers));
        // ----------------------------------------

        resultBox.style.display = "block";
        resultText.innerText = finalCode;
        
        // فیلڈز خالی کر دیں
        pInput.value = "";
        dInput.value = "";
    } else {
        alert("براہ کرم تمام معلومات درست لکھیں!");
    }
}

// سرچ کرنے کا فنکشن
function searchData() {
    let sPhone = document.getElementById("searchPhone").value.trim();
    let sResultBox = document.getElementById("searchResult");
    let foundCodeDiv = document.getElementById("foundCode");
    
    let customers = JSON.parse(localStorage.getItem("abuHamadDB") || "{}");

    if(customers[sPhone]) {
        sResultBox.style.display = "block";
        foundCodeDiv.innerText = customers[sPhone];
    } else {
        sResultBox.style.display = "none";
    }
}
</script>

</body>
        </html>
