<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbuHamad Admin - 03329106002</title>
<style>
    /* 🌙 آپ کے ایپ کا اوریجنل کلر تھیم */
    body { 
        font-family: 'Segoe UI', Arial; 
        background: #013220; 
        color: white; 
        text-align: center; 
        padding: 20px; 
        margin: 0;
    }

    .container { 
        max-width: 400px; 
        margin: 50px auto; 
    }

    .main-card { 
        background: #002215; 
        padding: 25px; 
        border: 2px solid #ffd700; 
        border-radius: 15px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }

    h2 { color: #ffd700; margin-bottom: 20px; font-size: 24px; }
    p { font-size: 14px; margin-bottom: 5px; color: #ccc; }

    input { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 15px; 
        border-radius: 8px; 
        border: 1px solid #ffd700; 
        background: #fff; 
        color: #000; 
        font-weight: bold; 
        text-align: center; 
        font-size: 16px;
        box-sizing: border-box;
    }

    button { 
        background: #ffd700; 
        color: #000; 
        width: 100%; 
        padding: 14px; 
        border: none; 
        border-radius: 8px; 
        font-weight: bold; 
        font-size: 18px; 
        cursor: pointer; 
        transition: 0.3s;
    }

    button:hover { background: #fff; }

    #result-box { 
        margin-top: 20px; 
        padding: 15px; 
        border: 1px dashed #00ffcc; 
        border-radius: 8px; 
        background: rgba(0,255,204,0.05);
        display: none; /* شروع میں چھپا ہوا */
    }

    #result { 
        font-size: 28px; 
        color: #00ffcc; 
        font-weight: bold; 
        letter-spacing: 5px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <h2>AbuHamad Admin</h2>
        
        <p>کسٹمر کا موبائل نمبر:</p>
        <input type="number" id="custPhone" placeholder="03329106002">
        
        <p>ڈیوائس آئی ڈی (جو واٹس ایپ پر آئی):</p>
        <input type="number" id="custDevice" placeholder="مثلاً: 1234">
        
        <button onclick="generateCode()">کوپن کوڈ جنریٹ کریں</button>
        
        <div id="result-box">
            <p style="color: #00ffcc;">کسٹمر کا کوڈ یہ ہے:</p>
            <div id="result"></div>
        </div>
    </div>
    
    <p style="margin-top: 20px; font-size: 12px;">Power by AbuHamad GRFX</p>
</div>

<script>
function generateCode() {
    let p = document.getElementById("custPhone").value;
    let d = document.getElementById("custDevice").value;
    const SALT = 5050; // یہ وہی کوڈ ہے جو آپ نے ایپ میں رکھا ہے

    if(p && d) {
        // موبائل کے آخری 4 ہندسے نکالنا
        let lastFour = p.slice(-4); 
        
        // فارمولا: آخری 4 ہندسے + ڈیوائس آئی ڈی + 5050
        let fullCode = (parseInt(lastFour) + parseInt(d) + SALT).toString();
        
        // رزلٹ دکھانا
        document.getElementById("result").innerText = fullCode;
        document.getElementById("result-box").style.display = "block";
    } else {
        alert("براہ کرم موبائل نمبر اور ڈیوائس آئی ڈی دونوں لکھیں");
    }
}
</script>

</body>
</html>
